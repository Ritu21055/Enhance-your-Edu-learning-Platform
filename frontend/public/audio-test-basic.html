<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebNexus Audio Test - Basic</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px;
            backdrop-filter: blur(10px);
        }
        
        h1 {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .test-button {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px;
            display: block;
            width: 100%;
            max-width: 300px;
            margin: 10px auto;
        }
        
        .test-button:hover {
            background: #ff5252;
            transform: translateY(-2px);
        }
        
        .results {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
            font-family: monospace;
            min-height: 200px;
        }
        
        .status {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            margin: 5px;
        }
        
        .status.passed {
            background: #2ecc71;
        }
        
        .status.failed {
            background: #e74c3c;
        }
        
        .status.running {
            background: #f39c12;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔊 WebNexus Audio Test</h1>
        
        <div class="results" id="results">
            <h3>Ready to test audio functionality...</h3>
        </div>
        
        <button class="test-button" onclick="test1()">Test 1: Browser Support</button>
        <button class="test-button" onclick="test2()">Test 2: Microphone</button>
        <button class="test-button" onclick="test3()">Test 3: Audio Context</button>
        <button class="test-button" onclick="test4()">Test 4: Audio Devices</button>
        <button class="test-button" onclick="clearResults()">Clear Results</button>
    </div>

    <script>
        function log(message) {
            const results = document.getElementById('results');
            results.innerHTML += '<div>' + message + '</div>';
        }
        
        function clearResults() {
            document.getElementById('results').innerHTML = '<h3>Results cleared...</h3>';
        }
        
        function test1() {
            log('<div class="status running">Testing Browser Support...</div>');
            
            const hasGetUserMedia = !!navigator.mediaDevices?.getUserMedia;
            const hasAudioContext = !!(window.AudioContext || window.webkitAudioContext);
            const hasWebRTC = !!(window.RTCPeerConnection || window.webkitRTCPeerConnection);
            
            if (hasGetUserMedia && hasAudioContext && hasWebRTC) {
                log('<div class="status passed">Browser Support: PASSED</div>');
            } else {
                log('<div class="status failed">Browser Support: FAILED</div>');
            }
            
            log('getUserMedia: ' + (hasGetUserMedia ? '✅' : '❌'));
            log('AudioContext: ' + (hasAudioContext ? '✅' : '❌'));
            log('WebRTC: ' + (hasWebRTC ? '✅' : '❌'));
        }
        
        async function test2() {
            log('<div class="status running">Testing Microphone...</div>');
            
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const audioTracks = stream.getAudioTracks();
                
                log('<div class="status passed">Microphone: PASSED</div>');
                log('Audio tracks found: ' + audioTracks.length);
                
                if (audioTracks.length > 0) {
                    const track = audioTracks[0];
                    log('Track enabled: ' + track.enabled);
                    log('Track ready state: ' + track.readyState);
                    log('Track label: ' + (track.label || 'Unknown'));
                }
                
                // Stop the stream
                stream.getTracks().forEach(track => track.stop());
            } catch (error) {
                log('<div class="status failed">Microphone: FAILED</div>');
                log('Error: ' + error.message);
            }
        }
        
        function test3() {
            log('<div class="status running">Testing Audio Context...</div>');
            
            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                log('<div class="status passed">Audio Context: PASSED</div>');
                log('State: ' + audioContext.state);
                log('Sample rate: ' + audioContext.sampleRate + 'Hz');
                audioContext.close();
            } catch (error) {
                log('<div class="status failed">Audio Context: FAILED</div>');
                log('Error: ' + error.message);
            }
        }
        
        async function test4() {
            log('<div class="status running">Testing Audio Devices...</div>');
            
            try {
                const devices = await navigator.mediaDevices.enumerateDevices();
                const audioInputs = devices.filter(d => d.kind === 'audioinput');
                const audioOutputs = devices.filter(d => d.kind === 'audiooutput');
                
                log('<div class="status passed">Audio Devices: PASSED</div>');
                log('Audio inputs: ' + audioInputs.length);
                log('Audio outputs: ' + audioOutputs.length);
                
                if (audioInputs.length > 0) {
                    log('Available input devices:');
                    audioInputs.forEach((device, index) => {
                        log('  ' + (index + 1) + '. ' + (device.label || 'Unknown device'));
                    });
                }
            } catch (error) {
                log('<div class="status failed">Audio Devices: FAILED</div>');
                log('Error: ' + error.message);
            }
        }
    </script>
</body>
</html>
