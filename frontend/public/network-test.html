<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-result { margin: 10px 0; padding: 10px; border-radius: 5px; }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .info { background-color: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>🌐 Network Configuration Test</h1>
    
    <div id="config-info" class="test-result info">
        <h3>Current Configuration:</h3>
        <div id="config-details"></div>
    </div>
    
    <div id="test-results"></div>
    
    <button onclick="testBackendConnection()">🔍 Test Backend Connection</button>
    <button onclick="testSocketConnection()">🔌 Test Socket Connection</button>
    <button onclick="testHealthEndpoint()">❤️ Test Health Endpoint</button>
    
    <script>
        // Display current configuration
        function displayConfig() {
            const configDiv = document.getElementById('config-details');
            configDiv.innerHTML = `
                <p><strong>Hostname:</strong> ${window.location.hostname}</p>
                <p><strong>Protocol:</strong> ${window.location.protocol}</p>
                <p><strong>Port:</strong> ${window.location.port || 'default'}</p>
                <p><strong>Full URL:</strong> ${window.location.href}</p>
                <p><strong>Is Localhost:</strong> ${window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'}</p>
            `;
        }
        
        // Test backend connection
        async function testBackendConnection() {
            const resultsDiv = document.getElementById('test-results');
            resultsDiv.innerHTML = '<div class="test-result info">🔄 Testing backend connection...</div>';
            
            try {
                // Test different possible backend URLs
                const possibleUrls = [
                    'http://192.168.0.108:5000/api/health',
                    'http://localhost:5000/api/health',
                    'http://127.0.0.1:5000/api/health'
                ];
                
                let success = false;
                let workingUrl = '';
                
                for (const url of possibleUrls) {
                    try {
                        console.log(`Testing: ${url}`);
                        const response = await fetch(url);
                        if (response.ok) {
                            const data = await response.json();
                            workingUrl = url;
                            success = true;
                            break;
                        }
                    } catch (error) {
                        console.log(`Failed: ${url} - ${error.message}`);
                    }
                }
                
                if (success) {
                    resultsDiv.innerHTML = `
                        <div class="test-result success">
                            ✅ Backend connection successful!<br>
                            <strong>Working URL:</strong> ${workingUrl}
                        </div>
                    `;
                } else {
                    resultsDiv.innerHTML = `
                        <div class="test-result error">
                            ❌ Backend connection failed!<br>
                            <strong>Tested URLs:</strong><br>
                            ${possibleUrls.map(url => `• ${url}`).join('<br>')}
                        </div>
                    `;
                }
            } catch (error) {
                resultsDiv.innerHTML = `
                    <div class="test-result error">
                        ❌ Backend connection error: ${error.message}
                    </div>
                `;
            }
        }
        
        // Test socket connection
        async function testSocketConnection() {
            const resultsDiv = document.getElementById('test-results');
            resultsDiv.innerHTML = '<div class="test-result info">🔄 Testing socket connection...</div>';
            
            try {
                // Import socket.io client
                const script = document.createElement('script');
                script.src = 'https://cdn.socket.io/4.7.2/socket.io.min.js';
                document.head.appendChild(script);
                
                script.onload = () => {
                    const possibleUrls = [
                        'http://192.168.0.108:5000',
                        'http://localhost:5000',
                        'http://127.0.0.1:5000'
                    ];
                    
                    let success = false;
                    let workingUrl = '';
                    
                    for (const url of possibleUrls) {
                        try {
                            console.log(`Testing socket: ${url}`);
                            const socket = io(url, {
                                timeout: 5000,
                                forceNew: true
                            });
                            
                            socket.on('connect', () => {
                                console.log(`Socket connected to: ${url}`);
                                workingUrl = url;
                                success = true;
                                socket.disconnect();
                                
                                resultsDiv.innerHTML = `
                                    <div class="test-result success">
                                        ✅ Socket connection successful!<br>
                                        <strong>Working URL:</strong> ${workingUrl}
                                    </div>
                                `;
                            });
                            
                            socket.on('connect_error', (error) => {
                                console.log(`Socket failed: ${url} - ${error.message}`);
                            });
                            
                            // Test timeout
                            setTimeout(() => {
                                if (!success) {
                                    socket.disconnect();
                                }
                            }, 3000);
                            
                        } catch (error) {
                            console.log(`Socket error: ${url} - ${error.message}`);
                        }
                    }
                    
                    setTimeout(() => {
                        if (!success) {
                            resultsDiv.innerHTML = `
                                <div class="test-result error">
                                    ❌ Socket connection failed!<br>
                                    <strong>Tested URLs:</strong><br>
                                    ${possibleUrls.map(url => `• ${url}`).join('<br>')}
                                </div>
                            `;
                        }
                    }, 5000);
                };
                
            } catch (error) {
                resultsDiv.innerHTML = `
                    <div class="test-result error">
                        ❌ Socket test error: ${error.message}
                    </div>
                `;
            }
        }
        
        // Test health endpoint
        async function testHealthEndpoint() {
            const resultsDiv = document.getElementById('test-results');
            resultsDiv.innerHTML = '<div class="test-result info">🔄 Testing health endpoint...</div>';
            
            try {
                const response = await fetch('http://192.168.0.108:5000/api/health');
                const data = await response.json();
                
                resultsDiv.innerHTML = `
                    <div class="test-result success">
                        ✅ Health endpoint working!<br>
                        <strong>Status:</strong> ${data.status}<br>
                        <strong>Message:</strong> ${data.message}
                    </div>
                `;
            } catch (error) {
                resultsDiv.innerHTML = `
                    <div class="test-result error">
                        ❌ Health endpoint failed: ${error.message}
                    </div>
                `;
            }
        }
        
        // Initialize
        displayConfig();
    </script>
</body>
</html>
