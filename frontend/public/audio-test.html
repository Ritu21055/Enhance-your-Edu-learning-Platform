<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebNexus Audio Functionality Test</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
        }
        
        .container {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        
        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5rem;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }
        
        .test-section {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            margin: 20px 0;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .test-button {
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            margin: 10px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        
        .test-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }
        
        .test-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .results {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            padding: 15px;
            margin: 10px 0;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            max-height: 300px;
            overflow-y: auto;
        }
        
        .status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            margin: 5px;
        }
        
        .status.passed {
            background: #2ecc71;
            color: white;
        }
        
        .status.failed {
            background: #e74c3c;
            color: white;
        }
        
        .status.running {
            background: #f39c12;
            color: white;
        }
        
        .audio-visualizer {
            width: 100%;
            height: 100px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            margin: 10px 0;
            position: relative;
            overflow: hidden;
        }
        
        .audio-bar {
            position: absolute;
            bottom: 0;
            background: linear-gradient(to top, #ff6b6b, #ffa500);
            width: 4px;
            margin: 0 1px;
            border-radius: 2px 2px 0 0;
            transition: height 0.1s ease;
        }
        
        .browser-info {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 15px;
            margin: 20px 0;
        }
        
        .browser-info h3 {
            margin-top: 0;
            color: #ffd700;
        }
        
        .browser-info p {
            margin: 5px 0;
            font-size: 14px;
        }
        
        .test-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }
        
        .quick-test {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
        }
        
        .quick-test h4 {
            margin-top: 0;
            color: #ffd700;
        }
        
        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
            overflow: hidden;
            margin: 10px 0;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff6b6b, #ffa500, #2ecc71);
            width: 0%;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔊 WebNexus Audio Functionality Test</h1>
        
        <div class="browser-info">
            <h3>🌐 Browser Information</h3>
            <p><strong>User Agent:</strong> <span id="userAgent"></span></p>
            <p><strong>Platform:</strong> <span id="platform"></span></p>
            <p><strong>Language:</strong> <span id="language"></span></p>
            <p><strong>Online:</strong> <span id="online"></span></p>
        </div>
        
        <div class="test-section">
            <h3>🚀 Quick Tests</h3>
            <div class="test-grid">
                <div class="quick-test">
                    <h4>Browser Support</h4>
                    <button class="test-button" onclick="testBrowserSupport()">Test Browser Support</button>
                    <div id="browserSupportResult"></div>
                </div>
                
                <div class="quick-test">
                    <h4>Microphone Access</h4>
                    <button class="test-button" onclick="testMicrophone()">Test Microphone</button>
                    <div id="microphoneResult"></div>
                </div>
                
                <div class="quick-test">
                    <h4>Audio Context</h4>
                    <button class="test-button" onclick="testAudioContext()">Test Audio Context</button>
                    <div id="audioContextResult"></div>
                </div>
                
                <div class="quick-test">
                    <h4>Audio Devices</h4>
                    <button class="test-button" onclick="testAudioDevices()">Test Audio Devices</button>
                    <div id="audioDevicesResult"></div>
                </div>
            </div>
        </div>
        
        <div class="test-section">
            <h3>🎯 Comprehensive Audio Tests</h3>
            <button class="test-button" onclick="runAllTests()">Run All Tests</button>
            <button class="test-button" onclick="clearResults()">Clear Results</button>
            
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            
            <div class="results" id="testResults"></div>
        </div>
        
        <div class="test-section">
            <h3>📊 Audio Visualizer</h3>
            <div class="audio-visualizer" id="audioVisualizer">
                <div class="audio-bar" style="left: 0%; height: 0%;"></div>
                <div class="audio-bar" style="left: 5%; height: 0%;"></div>
                <div class="audio-bar" style="left: 10%; height: 0%;"></div>
                <div class="audio-bar" style="left: 15%; height: 0%;"></div>
                <div class="audio-bar" style="left: 20%; height: 0%;"></div>
                <div class="audio-bar" style="left: 25%; height: 0%;"></div>
                <div class="audio-bar" style="left: 30%; height: 0%;"></div>
                <div class="audio-bar" style="left: 35%; height: 0%;"></div>
                <div class="audio-bar" style="left: 40%; height: 0%;"></div>
                <div class="audio-bar" style="left: 45%; height: 0%;"></div>
                <div class="audio-bar" style="left: 50%; height: 0%;"></div>
                <div class="audio-bar" style="left: 55%; height: 0%;"></div>
                <div class="audio-bar" style="left: 60%; height: 0%;"></div>
                <div class="audio-bar" style="left: 65%; height: 0%;"></div>
                <div class="audio-bar" style="left: 70%; height: 0%;"></div>
                <div class="audio-bar" style="left: 75%; height: 0%;"></div>
                <div class="audio-bar" style="left: 80%; height: 0%;"></div>
                <div class="audio-bar" style="left: 85%; height: 0%;"></div>
                <div class="audio-bar" style="left: 90%; height: 0%;"></div>
                <div class="audio-bar" style="left: 95%; height: 0%;"></div>
            </div>
            <button class="test-button" onclick="startVisualizer()">Start Audio Visualizer</button>
            <button class="test-button" onclick="stopVisualizer()">Stop Visualizer</button>
        </div>
        
        <div class="test-section">
            <h3>🔧 Audio Troubleshooting</h3>
            <button class="test-button" onclick="testAudioConstraints()">Test Audio Constraints</button>
            <button class="test-button" onclick="testEchoCancellation()">Test Echo Cancellation</button>
            <button class="test-button" onclick="testNoiseSuppression()">Test Noise Suppression</button>
            <button class="test-button" onclick="testAutoGainControl()">Test Auto Gain Control</button>
            <div id="troubleshootingResults"></div>
        </div>
    </div>

    <script src="test-audio-functionality.js"></script>
    <script>
        // Initialize browser info
        document.getElementById('userAgent').textContent = navigator.userAgent;
        document.getElementById('platform').textContent = navigator.platform;
        document.getElementById('language').textContent = navigator.language;
        document.getElementById('online').textContent = navigator.onLine ? 'Yes' : 'No';
        
        let visualizerInterval = null;
        let audioContext = null;
        let analyser = null;
        let source = null;
        
        // Quick test functions
        async function testBrowserSupport() {
            const result = testBrowserAudioSupport();
            const resultDiv = document.getElementById('browserSupportResult');
            resultDiv.innerHTML = `<span class="status ${result.getUserMedia && result.audioContext ? 'passed' : 'failed'}">${result.getUserMedia && result.audioContext ? 'PASSED' : 'FAILED'}</span>`;
        }
        
        async function testMicrophone() {
            try {
                const result = await testMicrophoneAccess();
                const resultDiv = document.getElementById('microphoneResult');
                resultDiv.innerHTML = `<span class="status ${result ? 'passed' : 'failed'}">${result ? 'PASSED' : 'FAILED'}</span>`;
            } catch (error) {
                document.getElementById('microphoneResult').innerHTML = `<span class="status failed">FAILED: ${error.message}</span>`;
            }
        }
        
        async function testAudioContext() {
            try {
                const result = testAudioContextCreation();
                const resultDiv = document.getElementById('audioContextResult');
                resultDiv.innerHTML = `<span class="status ${result ? 'passed' : 'failed'}">${result ? 'PASSED' : 'FAILED'}</span>`;
            } catch (error) {
                document.getElementById('audioContextResult').innerHTML = `<span class="status failed">FAILED: ${error.message}</span>`;
            }
        }
        
        async function testAudioDevices() {
            try {
                const result = await testAudioDeviceEnumeration();
                const resultDiv = document.getElementById('audioDevicesResult');
                resultDiv.innerHTML = `<span class="status ${result ? 'passed' : 'failed'}">${result ? 'PASSED' : 'FAILED'}</span>`;
            } catch (error) {
                document.getElementById('audioDevicesResult').innerHTML = `<span class="status failed">FAILED: ${error.message}</span>`;
            }
        }
        
        // Comprehensive test runner
        async function runAllTests() {
            const resultsDiv = document.getElementById('testResults');
            const progressFill = document.getElementById('progressFill');
            
            resultsDiv.innerHTML = '<div class="status running">Running comprehensive audio tests...</div>';
            progressFill.style.width = '0%';
            
            try {
                const results = await runAllAudioTests();
                
                let html = '<h4>Test Results:</h4>';
                let passedCount = 0;
                let totalCount = 0;
                
                for (const [testName, result] of Object.entries(results)) {
                    totalCount++;
                    const passed = typeof result === 'boolean' ? result : result.success !== false;
                    if (passed) passedCount++;
                    
                    html += `<div><span class="status ${passed ? 'passed' : 'failed'}">${passed ? 'PASSED' : 'FAILED'}</span> ${testName}</div>`;
                }
                
                html += `<div><strong>Summary: ${passedCount}/${totalCount} tests passed</strong></div>`;
                resultsDiv.innerHTML = html;
                
                progressFill.style.width = `${(passedCount / totalCount) * 100}%`;
                
            } catch (error) {
                resultsDiv.innerHTML = `<div class="status failed">Test failed: ${error.message}</div>`;
            }
        }
        
        // Audio visualizer
        async function startVisualizer() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                source = audioContext.createMediaStreamSource(stream);
                analyser = audioContext.createAnalyser();
                
                analyser.fftSize = 256;
                source.connect(analyser);
                
                const bufferLength = analyser.frequencyBinCount;
                const dataArray = new Uint8Array(bufferLength);
                
                visualizerInterval = setInterval(() => {
                    analyser.getByteFrequencyData(dataArray);
                    
                    const bars = document.querySelectorAll('.audio-bar');
                    const barCount = bars.length;
                    const dataPerBar = Math.floor(bufferLength / barCount);
                    
                    bars.forEach((bar, index) => {
                        const startIndex = index * dataPerBar;
                        const endIndex = Math.min(startIndex + dataPerBar, bufferLength);
                        let sum = 0;
                        
                        for (let i = startIndex; i < endIndex; i++) {
                            sum += dataArray[i];
                        }
                        
                        const average = sum / (endIndex - startIndex);
                        const height = (average / 255) * 100;
                        
                        bar.style.height = `${Math.max(height, 2)}%`;
                    });
                }, 100);
                
                console.log('Audio visualizer started');
            } catch (error) {
                console.error('Failed to start audio visualizer:', error);
                alert('Failed to start audio visualizer: ' + error.message);
            }
        }
        
        function stopVisualizer() {
            if (visualizerInterval) {
                clearInterval(visualizerInterval);
                visualizerInterval = null;
            }
            
            if (source) {
                source.disconnect();
                source = null;
            }
            
            if (audioContext) {
                audioContext.close();
                audioContext = null;
            }
            
            analyser = null;
            
            // Reset bars
            document.querySelectorAll('.audio-bar').forEach(bar => {
                bar.style.height = '0%';
            });
            
            console.log('Audio visualizer stopped');
        }
        
        // Troubleshooting tests
        async function testAudioConstraints() {
            const resultsDiv = document.getElementById('troubleshootingResults');
            resultsDiv.innerHTML = '<div class="status running">Testing audio constraints...</div>';
            
            try {
                const results = await testAudioConstraints();
                let html = '<h4>Audio Constraints Test Results:</h4>';
                
                for (const [testName, result] of Object.entries(results)) {
                    html += `<div><span class="status ${result.success ? 'passed' : 'failed'}">${result.success ? 'PASSED' : 'FAILED'}</span> ${testName}</div>`;
                    if (result.error) {
                        html += `<div style="margin-left: 20px; color: #ff6b6b;">Error: ${result.error}</div>`;
                    }
                }
                
                resultsDiv.innerHTML = html;
            } catch (error) {
                resultsDiv.innerHTML = `<div class="status failed">Test failed: ${error.message}</div>`;
            }
        }
        
        async function testEchoCancellation() {
            const resultsDiv = document.getElementById('troubleshootingResults');
            resultsDiv.innerHTML = '<div class="status running">Testing echo cancellation...</div>';
            
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: false,
                        autoGainControl: false
                    }
                });
                
                const audioTrack = stream.getAudioTracks()[0];
                const constraints = audioTrack.getConstraints();
                
                resultsDiv.innerHTML = `
                    <div class="status passed">Echo Cancellation Test PASSED</div>
                    <div>Constraints: ${JSON.stringify(constraints, null, 2)}</div>
                `;
                
                stream.getTracks().forEach(track => track.stop());
            } catch (error) {
                resultsDiv.innerHTML = `<div class="status failed">Echo Cancellation Test FAILED: ${error.message}</div>`;
            }
        }
        
        async function testNoiseSuppression() {
            const resultsDiv = document.getElementById('troubleshootingResults');
            resultsDiv.innerHTML = '<div class="status running">Testing noise suppression...</div>';
            
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        echoCancellation: false,
                        noiseSuppression: true,
                        autoGainControl: false
                    }
                });
                
                const audioTrack = stream.getAudioTracks()[0];
                const constraints = audioTrack.getConstraints();
                
                resultsDiv.innerHTML = `
                    <div class="status passed">Noise Suppression Test PASSED</div>
                    <div>Constraints: ${JSON.stringify(constraints, null, 2)}</div>
                `;
                
                stream.getTracks().forEach(track => track.stop());
            } catch (error) {
                resultsDiv.innerHTML = `<div class="status failed">Noise Suppression Test FAILED: ${error.message}</div>`;
            }
        }
        
        async function testAutoGainControl() {
            const resultsDiv = document.getElementById('troubleshootingResults');
            resultsDiv.innerHTML = '<div class="status running">Testing auto gain control...</div>';
            
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        echoCancellation: false,
                        noiseSuppression: false,
                        autoGainControl: true
                    }
                });
                
                const audioTrack = stream.getAudioTracks()[0];
                const constraints = audioTrack.getConstraints();
                
                resultsDiv.innerHTML = `
                    <div class="status passed">Auto Gain Control Test PASSED</div>
                    <div>Constraints: ${JSON.stringify(constraints, null, 2)}</div>
                `;
                
                stream.getTracks().forEach(track => track.stop());
            } catch (error) {
                resultsDiv.innerHTML = `<div class="status failed">Auto Gain Control Test FAILED: ${error.message}</div>`;
            }
        }
        
        function clearResults() {
            document.getElementById('testResults').innerHTML = '';
            document.getElementById('troubleshootingResults').innerHTML = '';
            document.getElementById('progressFill').style.width = '0%';
        }
        
        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            stopVisualizer();
        });
    </script>
</body>
</html>
