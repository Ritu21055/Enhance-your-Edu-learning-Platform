<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebRTC Audio Test - WebNexus</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: white;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }
        
        .test-section {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            margin: 20px 0;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .test-button {
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin: 10px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        
        .test-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }
        
        .status {
            padding: 15px;
            border-radius: 10px;
            margin: 10px 0;
            font-weight: bold;
            text-align: center;
        }
        
        .status.success {
            background: rgba(46, 204, 113, 0.3);
            border: 2px solid #2ecc71;
            color: #2ecc71;
        }
        
        .status.error {
            background: rgba(231, 76, 60, 0.3);
            border: 2px solid #e74c3c;
            color: #e74c3c;
        }
        
        .status.info {
            background: rgba(52, 152, 219, 0.3);
            border: 2px solid #3498db;
            color: #3498db;
        }
        
        .audio-level {
            width: 100%;
            height: 30px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            overflow: hidden;
            margin: 15px 0;
        }
        
        .audio-level-bar {
            height: 100%;
            background: linear-gradient(90deg, #2ecc71, #f1c40f, #e74c3c);
            width: 0%;
            transition: width 0.1s ease;
        }
        
        .debug-log {
            background: rgba(0, 0, 0, 0.2);
            padding: 15px;
            border-radius: 10px;
            font-family: monospace;
            font-size: 12px;
            max-height: 300px;
            overflow-y: auto;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎤 WebRTC Audio Test</h1>
        
        <div class="test-section">
            <h3>🔧 Test WebNexus Audio Settings</h3>
            <button class="test-button" onclick="testWebNexusAudio()">
                Test WebNexus Audio Configuration
            </button>
            <div id="testStatus" class="status info">Click the button above to test WebNexus audio settings</div>
        </div>
        
        <div class="test-section">
            <h3>📊 Audio Level Monitor</h3>
            <div class="audio-level">
                <div id="audioLevelBar" class="audio-level-bar"></div>
            </div>
            <div id="audioLevelText">Level: 0%</div>
            <div id="audioStatus" class="status info">Microphone not active</div>
        </div>
        
        <div class="test-section">
            <h3>📝 Debug Information</h3>
            <button class="test-button" onclick="clearDebugLog()">Clear Log</button>
            <button class="test-button" onclick="exportDebugLog()">Export Log</button>
            <div id="debugLog" class="debug-log">
                WebRTC audio test ready...
            </div>
        </div>
    </div>

    <script>
        let audioContext = null;
        let analyser = null;
        let microphoneSource = null;
        let isMonitoring = false;
        let debugLog = [];

        function log(message) {
            const timestamp = new Date().toLocaleTimeString();
            const logMessage = `[${timestamp}] ${message}`;
            debugLog.push(logMessage);
            console.log(logMessage);
            
            const debugElement = document.getElementById('debugLog');
            debugElement.innerHTML = debugLog.slice(-15).join('<br>');
            debugElement.scrollTop = debugElement.scrollHeight;
        }

        function updateStatus(message, type = 'info') {
            const status = document.getElementById('testStatus');
            status.textContent = message;
            status.className = `status ${type}`;
        }

        function updateAudioStatus(message, type = 'info') {
            const status = document.getElementById('audioStatus');
            status.textContent = message;
            status.className = `status ${type}`;
        }

        async function testWebNexusAudio() {
            log('🎤 Testing WebNexus audio configuration...');
            updateStatus('Testing WebNexus audio settings...', 'info');
            
            try {
                // Test with the same constraints as WebNexus
                const videoConstraints = {
                    width: 960,
                    height: 540,
                    frameRate: 24,
                    facingMode: 'user'
                };
                
                const audioConstraints = {
                    echoCancellation: true,
                    noiseSuppression: true,
                    autoGainControl: true,
                    deviceId: { ideal: 'default' }
                };
                
                log('🔧 Using WebNexus audio constraints:');
                log(`   - echoCancellation: ${audioConstraints.echoCancellation}`);
                log(`   - noiseSuppression: ${audioConstraints.noiseSuppression}`);
                log(`   - autoGainControl: ${audioConstraints.autoGainControl}`);
                log(`   - deviceId: ${JSON.stringify(audioConstraints.deviceId)}`);
                
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: videoConstraints,
                    audio: audioConstraints
                });
                
                log('✅ WebNexus audio configuration successful');
                
                // Check what device was actually selected
                const audioTracks = stream.getAudioTracks();
                if (audioTracks.length > 0) {
                    const audioTrack = audioTracks[0];
                    log(`📊 Selected audio device: ${audioTrack.label}`);
                    log(`   - Enabled: ${audioTrack.enabled}`);
                    log(`   - Muted: ${audioTrack.muted}`);
                    log(`   - Ready State: ${audioTrack.readyState}`);
                    
                    // Check if it's the right device
                    if (audioTrack.label.includes('Microphone Array')) {
                        log('✅ Correct microphone selected (Microphone Array)');
                        updateStatus('✅ WebNexus is using the correct microphone!', 'success');
                    } else if (audioTrack.label.includes('Stereo Mix')) {
                        log('❌ Wrong device selected (Stereo Mix)');
                        updateStatus('❌ WebNexus is still using Stereo Mix. Check your default microphone settings.', 'error');
                    } else {
                        log(`⚠️ Unknown device selected: ${audioTrack.label}`);
                        updateStatus(`⚠️ WebNexus selected: ${audioTrack.label}`, 'info');
                    }
                }
                
                // Set up audio analysis
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                microphoneSource = audioContext.createMediaStreamSource(stream);
                microphoneSource.connect(analyser);
                
                analyser.fftSize = 256;
                const bufferLength = analyser.frequencyBinCount;
                const dataArray = new Uint8Array(bufferLength);
                
                log('🎯 Starting audio level monitoring...');
                updateAudioStatus('Monitoring audio levels...', 'info');
                
                // Start monitoring
                isMonitoring = true;
                monitorAudioLevel();
                
                // Test for 5 seconds
                let maxLevel = 0;
                let testDuration = 5000;
                let startTime = Date.now();
                
                const testInterval = setInterval(() => {
                    analyser.getByteFrequencyData(dataArray);
                    const average = dataArray.reduce((a, b) => a + b) / dataArray.length;
                    maxLevel = Math.max(maxLevel, average);
                    
                    if (Date.now() - startTime >= testDuration) {
                        clearInterval(testInterval);
                        stopMonitoring();
                        
                        // Clean up
                        stream.getTracks().forEach(track => track.stop());
                        if (audioContext) {
                            audioContext.close();
                        }
                        
                        if (maxLevel > 5) {
                            log(`✅ Audio test PASSED! Max level: ${Math.round(maxLevel)}`);
                            updateStatus(`✅ WebNexus audio is working! Max level: ${Math.round(maxLevel)}`, 'success');
                        } else {
                            log(`❌ Audio test FAILED! Max level: ${Math.round(maxLevel)}`);
                            updateStatus(`❌ WebNexus audio not working. Max level: ${Math.round(maxLevel)}`, 'error');
                        }
                    }
                }, 100);
                
            } catch (error) {
                log(`❌ WebNexus audio test failed: ${error.message}`);
                updateStatus(`❌ WebNexus audio test failed: ${error.message}`, 'error');
            }
        }

        function monitorAudioLevel() {
            if (!isMonitoring || !analyser) return;
            
            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            analyser.getByteFrequencyData(dataArray);
            
            const average = dataArray.reduce((a, b) => a + b) / dataArray.length;
            const percentage = Math.min((average / 128) * 100, 100);
            
            // Update visual level
            const audioLevelBar = document.getElementById('audioLevelBar');
            const audioLevelText = document.getElementById('audioLevelText');
            
            audioLevelBar.style.width = `${percentage}%`;
            audioLevelText.textContent = `Level: ${Math.round(percentage)}%`;
            
            if (average > 5) {
                updateAudioStatus(`🎤 Audio detected! Level: ${Math.round(percentage)}%`, 'success');
            } else {
                updateAudioStatus('🔇 No audio detected', 'info');
            }
            
            requestAnimationFrame(monitorAudioLevel);
        }

        function stopMonitoring() {
            isMonitoring = false;
            updateAudioStatus('Monitoring stopped', 'info');
        }

        function clearDebugLog() {
            debugLog = [];
            document.getElementById('debugLog').innerHTML = 'Debug log cleared...';
            log('🧹 Debug log cleared');
        }

        function exportDebugLog() {
            const logText = debugLog.join('\n');
            const blob = new Blob([logText], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `webrtc-audio-debug-${new Date().toISOString().slice(0, 19).replace(/:/g, '-')}.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            log('📁 Debug log exported');
        }

        // Initialize
        log('🎤 WebRTC Audio Test Page Loaded');
        updateStatus('Ready to test WebNexus audio configuration', 'info');
    </script>
</body>
</html>
