<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebNexus Audio Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px;
            backdrop-filter: blur(10px);
        }
        
        h1 {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .test-button {
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px;
            display: block;
            width: 100%;
            max-width: 300px;
            margin: 10px auto;
        }
        
        .test-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }
        
        .results {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
            font-family: monospace;
        }
        
        .status {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            margin: 5px;
        }
        
        .status.passed {
            background: #2ecc71;
        }
        
        .status.failed {
            background: #e74c3c;
        }
        
        .status.running {
            background: #f39c12;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔊 WebNexus Audio Test</h1>
        
        <div class="results" id="results">
            <h3>Ready to test audio functionality...</h3>
        </div>
        
        <button class="test-button" onclick="testBrowserSupport()">Test Browser Support</button>
        <button class="test-button" onclick="testMicrophone()">Test Microphone</button>
        <button class="test-button" onclick="testAudioContext()">Test Audio Context</button>
        <button class="test-button" onclick="testAudioDevices()">Test Audio Devices</button>
        <button class="test-button" onclick="testAudioConstraints()">Test Audio Constraints</button>
        <button class="test-button" onclick="testEchoCancellation()">Test Echo Cancellation</button>
        <button class="test-button" onclick="testNoiseSuppression()">Test Noise Suppression</button>
        <button class="test-button" onclick="testAutoGainControl()">Test Auto Gain Control</button>
        <button class="test-button" onclick="runAllTests()">Run All Tests</button>
    </div>

    <script>
        function log(message) {
            const results = document.getElementById('results');
            results.innerHTML += '<div>' + message + '</div>';
        }
        
        function testBrowserSupport() {
            log('<div class="status running">Testing Browser Support...</div>');
            
            const support = {
                getUserMedia: !!navigator.mediaDevices?.getUserMedia,
                audioContext: !!(window.AudioContext || window.webkitAudioContext),
                webRTC: !!(window.RTCPeerConnection || window.webkitRTCPeerConnection)
            };
            
            const allSupported = Object.values(support).every(s => s);
            
            log('<div class="status ' + (allSupported ? 'passed' : 'failed') + '">Browser Support: ' + (allSupported ? 'PASSED' : 'FAILED') + '</div>');
            log('getUserMedia: ' + (support.getUserMedia ? '✅' : '❌'));
            log('AudioContext: ' + (support.audioContext ? '✅' : '❌'));
            log('WebRTC: ' + (support.webRTC ? '✅' : '❌'));
        }
        
        async function testMicrophone() {
            log('<div class="status running">Testing Microphone...</div>');
            
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const audioTracks = stream.getAudioTracks();
                
                log('<div class="status passed">Microphone: PASSED</div>');
                log('Audio tracks: ' + audioTracks.length);
                log('Track enabled: ' + audioTracks[0]?.enabled);
                log('Track ready state: ' + audioTracks[0]?.readyState);
                
                stream.getTracks().forEach(track => track.stop());
            } catch (error) {
                log('<div class="status failed">Microphone: FAILED</div>');
                log('Error: ' + error.message);
            }
        }
        
        function testAudioContext() {
            log('<div class="status running">Testing Audio Context...</div>');
            
            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                log('<div class="status passed">Audio Context: PASSED</div>');
                log('State: ' + audioContext.state);
                log('Sample rate: ' + audioContext.sampleRate + 'Hz');
                audioContext.close();
            } catch (error) {
                log('<div class="status failed">Audio Context: FAILED</div>');
                log('Error: ' + error.message);
            }
        }
        
        async function testAudioDevices() {
            log('<div class="status running">Testing Audio Devices...</div>');
            
            try {
                const devices = await navigator.mediaDevices.enumerateDevices();
                const audioInputs = devices.filter(d => d.kind === 'audioinput');
                const audioOutputs = devices.filter(d => d.kind === 'audiooutput');
                
                log('<div class="status passed">Audio Devices: PASSED</div>');
                log('Audio inputs: ' + audioInputs.length);
                log('Audio outputs: ' + audioOutputs.length);
                
                audioInputs.forEach((device, index) => {
                    log('Input ' + (index + 1) + ': ' + (device.label || 'Unknown device'));
                });
            } catch (error) {
                log('<div class="status failed">Audio Devices: FAILED</div>');
                log('Error: ' + error.message);
            }
        }
        
        // Additional test functions for troubleshooting
        async function testAudioConstraints() {
            log('<div class="status running">Testing Audio Constraints...</div>');
            
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true
                    }
                });
                
                const audioTrack = stream.getAudioTracks()[0];
                const constraints = audioTrack.getConstraints();
                
                log('<div class="status passed">Audio Constraints: PASSED</div>');
                log('Constraints applied: ' + JSON.stringify(constraints));
                
                stream.getTracks().forEach(track => track.stop());
            } catch (error) {
                log('<div class="status failed">Audio Constraints: FAILED</div>');
                log('Error: ' + error.message);
            }
        }
        
        async function testEchoCancellation() {
            log('<div class="status running">Testing Echo Cancellation...</div>');
            
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: false,
                        autoGainControl: false
                    }
                });
                
                log('<div class="status passed">Echo Cancellation: PASSED</div>');
                stream.getTracks().forEach(track => track.stop());
            } catch (error) {
                log('<div class="status failed">Echo Cancellation: FAILED</div>');
                log('Error: ' + error.message);
            }
        }
        
        async function testNoiseSuppression() {
            log('<div class="status running">Testing Noise Suppression...</div>');
            
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        echoCancellation: false,
                        noiseSuppression: true,
                        autoGainControl: false
                    }
                });
                
                log('<div class="status passed">Noise Suppression: PASSED</div>');
                stream.getTracks().forEach(track => track.stop());
            } catch (error) {
                log('<div class="status failed">Noise Suppression: FAILED</div>');
                log('Error: ' + error.message);
            }
        }
        
        async function testAutoGainControl() {
            log('<div class="status running">Testing Auto Gain Control...</div>');
            
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        echoCancellation: false,
                        noiseSuppression: false,
                        autoGainControl: true
                    }
                });
                
                log('<div class="status passed">Auto Gain Control: PASSED</div>');
                stream.getTracks().forEach(track => track.stop());
            } catch (error) {
                log('<div class="status failed">Auto Gain Control: FAILED</div>');
                log('Error: ' + error.message);
            }
        }
        
        async function runAllTests() {
            log('<div class="status running">Running All Tests...</div>');
            document.getElementById('results').innerHTML = '';
            
            // Test 1: Browser Support
            testBrowserSupport();
            await new Promise(resolve => setTimeout(resolve, 1000));
            
            // Test 2: Audio Context
            testAudioContext();
            await new Promise(resolve => setTimeout(resolve, 1000));
            
            // Test 3: Microphone
            await testMicrophone();
            await new Promise(resolve => setTimeout(resolve, 1000));
            
            // Test 4: Audio Devices
            await testAudioDevices();
            await new Promise(resolve => setTimeout(resolve, 1000));
            
            // Test 5: Audio Constraints
            await testAudioConstraints();
            await new Promise(resolve => setTimeout(resolve, 1000));
            
            // Test 6: Echo Cancellation
            await testEchoCancellation();
            await new Promise(resolve => setTimeout(resolve, 1000));
            
            // Test 7: Noise Suppression
            await testNoiseSuppression();
            await new Promise(resolve => setTimeout(resolve, 1000));
            
            // Test 8: Auto Gain Control
            await testAutoGainControl();
            
            log('<div style="margin-top: 20px; font-weight: bold; color: #2ecc71;">🎯 All tests completed!</div>');
        }
    </script>
</body>
</html>
