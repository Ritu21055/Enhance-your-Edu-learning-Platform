<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speech → Questions → Notes Test (With Logs)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
        }
        
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        button {
            padding: 12px 24px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }
        
        .btn-start {
            background: #28a745;
            color: white;
        }
        
        .btn-start:hover {
            background: #218838;
        }
        
        .btn-stop {
            background: #dc3545;
            color: white;
        }
        
        .btn-stop:hover {
            background: #c82333;
        }
        
        .btn-generate-questions {
            background: #ffc107;
            color: #212529;
        }
        
        .btn-generate-questions:hover {
            background: #e0a800;
        }
        
        .btn-generate-notes {
            background: #007bff;
            color: white;
        }
        
        .btn-generate-notes:hover {
            background: #0056b3;
        }
        
        .btn-clear {
            background: #6c757d;
            color: white;
        }
        
        .btn-clear:hover {
            background: #5a6268;
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .status {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: bold;
        }
        
        .status.listening {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .status.stopped {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .status.connected {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        
        .transcript-box, .questions-box, .notes-box, .logs-box {
            background: #f8f9fa;
            border: 2px solid #dee2e6;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            min-height: 200px;
            max-height: 500px;
            overflow-y: auto;
        }
        
        .questions-box {
            background: #fff3cd;
            border-color: #ffc107;
        }
        
        .notes-box {
            background: #d1ecf1;
            border-color: #17a2b8;
        }
        
        .logs-box {
            background: #1e1e1e;
            border-color: #333;
            color: #d4d4d4;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            max-height: 400px;
        }
        
        .transcript-box h3, .questions-box h3, .notes-box h3, .logs-box h3 {
            margin-bottom: 10px;
            color: #495057;
        }
        
        .logs-box h3 {
            color: #fff;
        }
        
        .log-entry {
            padding: 5px 0;
            border-bottom: 1px solid #333;
        }
        
        .log-entry.frontend {
            color: #4ec9b0;
        }
        
        .log-entry.backend {
            color: #ce9178;
        }
        
        .log-entry.error {
            color: #f48771;
        }
        
        .log-entry.success {
            color: #4ec9b0;
        }
        
        .log-entry.warning {
            color: #dcdcaa;
        }
        
        .log-timestamp {
            color: #858585;
            margin-right: 10px;
        }
        
        .question-item {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 4px solid #ffc107;
        }
        
        .question-item strong {
            color: #856404;
            display: block;
            margin-bottom: 5px;
        }
        
        .transcript-text {
            font-size: 16px;
            line-height: 1.6;
            color: #212529;
            white-space: pre-wrap;
        }
        
        .notes-content {
            background: white;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #17a2b8;
        }
        
        .notes-section {
            margin-bottom: 20px;
        }
        
        .notes-section h4 {
            color: #0c5460;
            margin-bottom: 10px;
            border-bottom: 2px solid #17a2b8;
            padding-bottom: 5px;
        }
        
        .model-info {
            margin-bottom: 15px;
            padding: 10px;
            background: #e9ecef;
            border-radius: 5px;
            font-size: 14px;
        }
        
        .notes-section ul {
            margin-left: 20px;
        }
        
        .notes-section li {
            margin-bottom: 8px;
            line-height: 1.6;
        }
        
        .loading {
            text-align: center;
            padding: 20px;
            color: #007bff;
            font-weight: bold;
        }
        
        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
        }
        
        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .stat-card {
            background: #e9ecef;
            padding: 15px;
            border-radius: 8px;
            flex: 1;
            min-width: 150px;
        }
        
        .stat-card strong {
            display: block;
            color: #495057;
            margin-bottom: 5px;
        }
        
        .stat-card span {
            font-size: 24px;
            color: #007bff;
            font-weight: bold;
        }
        
        .two-column {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        @media (max-width: 1200px) {
            .two-column {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎤 Speech → AI Questions → Notes Test (With Logs)</h1>
        
        <div class="controls">
            <button class="btn-start" onclick="startListening()" id="startBtn">🎤 Start Listening</button>
            <button class="btn-stop" onclick="stopListening()" disabled id="stopBtn">⏹️ Stop Listening</button>
            <button class="btn-generate-questions" onclick="triggerQuestionGeneration()" disabled id="generateQuestionsBtn">❓ Trigger Question Generation</button>
            <button class="btn-generate-notes" onclick="generateNotes()" disabled id="generateNotesBtn">📝 Generate Notes</button>
            <button class="btn-clear" onclick="clearAll()">🗑️ Clear All</button>
        </div>
        
        <div class="status stopped" id="statusDiv">
            Status: Disconnected - Connecting to backend...
        </div>
        
        <div class="stats">
            <div class="stat-card">
                <strong>Words</strong>
                <span id="wordCount">0</span>
            </div>
            <div class="stat-card">
                <strong>Sentences</strong>
                <span id="sentenceCount">0</span>
            </div>
            <div class="stat-card">
                <strong>Characters</strong>
                <span id="charCount">0</span>
            </div>
            <div class="stat-card">
                <strong>Questions Generated</strong>
                <span id="questionCount">0</span>
            </div>
        </div>
        
        <div class="two-column">
            <div>
                <div class="transcript-box">
                    <h3>📝 Your Speech Transcript:</h3>
                    <div class="transcript-text" id="transcriptDiv">
                        Your speech will appear here...
                    </div>
                </div>
                
                <div class="questions-box" id="questionsBox" style="display: none;">
                    <h3>❓ Generated Questions (Auto):</h3>
                    <div id="questionsContent"></div>
                </div>
                
                <div class="notes-box" id="notesBox" style="display: none;">
                    <h3>📋 Generated Notes:</h3>
                    <div class="notes-content" id="notesContent"></div>
                </div>
            </div>
            
            <div>
                <div class="logs-box">
                    <h3>📋 Logs (Frontend + Backend)</h3>
                    <div id="logsContent"></div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script>
        let recognition = null;
        let fullTranscript = '';
        let isListening = false;
        let generatedQuestions = [];
        let socket = null;
        let meetingId = 'test-meeting-' + Date.now();
        let participantId = 'test-participant-' + Date.now();
        let participantName = 'Test User';
        let logs = [];
        const MAX_LOGS = 200;
        
        // Logging function
        function addLog(type, message, source = 'frontend') {
            const timestamp = new Date().toLocaleTimeString();
            const logEntry = {
                timestamp,
                type,
                message,
                source
            };
            
            logs.push(logEntry);
            if (logs.length > MAX_LOGS) {
                logs.shift();
            }
            
            updateLogsDisplay();
            console.log(`[${timestamp}] [${source.toUpperCase()}] [${type.toUpperCase()}] ${message}`);
        }
        
        function updateLogsDisplay() {
            const logsContent = document.getElementById('logsContent');
            let html = '';
            
            logs.slice(-100).reverse().forEach(log => {
                const className = `${log.source} ${log.type}`;
                html += `
                    <div class="log-entry ${className}">
                        <span class="log-timestamp">[${log.timestamp}]</span>
                        <span class="log-source">[${log.source.toUpperCase()}]</span>
                        <span class="log-type">[${log.type.toUpperCase()}]</span>
                        <span class="log-message">${log.message}</span>
                    </div>
                `;
            });
            
            logsContent.innerHTML = html || '<div class="log-entry">No logs yet...</div>';
            logsContent.scrollTop = 0; // Scroll to top (newest logs)
        }
        
        // Initialize Socket.IO
        function initSocket() {
            // Better backend URL detection
            let backendUrl = 'http://localhost:5000'; // Default
            
            const hostname = window.location.hostname;
            const protocol = window.location.protocol;
            
            // Check if localhost
            if (hostname === 'localhost' || hostname === '127.0.0.1') {
                backendUrl = 'http://localhost:5000';
            } 
            // Check if IP address (like 192.168.x.x)
            else if (/^\d+\.\d+\.\d+\.\d+$/.test(hostname)) {
                backendUrl = `${protocol}//${hostname}:5000`;
            }
            // Otherwise use current origin with port 5000
            else {
                const currentOrigin = window.location.origin;
                backendUrl = currentOrigin.replace(':3000', ':5000').replace(/:(\d+)/, ':5000');
            }
            
            // Allow manual override via localStorage
            if (localStorage.getItem('backendUrl')) {
                backendUrl = localStorage.getItem('backendUrl');
                addLog('info', 'Using backend URL from localStorage', 'frontend');
            }
            
            addLog('info', `Connecting to backend: ${backendUrl}`, 'frontend');
            addLog('info', `Current hostname: ${hostname}`, 'frontend');
            
            socket = io(backendUrl, {
                transports: ['websocket', 'polling'],
                reconnection: true,
                reconnectionDelay: 1000,
                reconnectionAttempts: 5,
                timeout: 20000,
                forceNew: true
            });
            
            socket.on('connect', () => {
                addLog('success', 'Socket.IO connected successfully', 'frontend');
                addLog('info', `Socket ID: ${socket.id}`, 'frontend');
                updateStatus('connected', 'Status: Connected to backend - Ready to start');
                document.getElementById('startBtn').disabled = false;
                
                // Join test meeting - Use correct event name and parameters
                socket.emit('join-meeting', {  // FIX: join-meeting (hyphen, not underscore)
                    meetingId: meetingId,
                    userName: participantName,  // FIX: userName (not participantName)
                    meetingTitle: 'Test Meeting',  // Added: meetingTitle
                    isHost: true,  // Frontend indicates user wants to be host
                    setPassword: undefined  // Not setting password
                });
                addLog('info', `Joined test meeting: ${meetingId}`, 'frontend');
            });
            
            socket.on('disconnect', (reason) => {
                addLog('warning', `Socket.IO disconnected: ${reason}`, 'frontend');
                updateStatus('stopped', 'Status: Disconnected from backend');
            });
            
            socket.on('connect_error', (error) => {
                addLog('error', `Connection error: ${error.message}`, 'frontend');
                addLog('error', `Tried connecting to: ${backendUrl}`, 'frontend');
                updateStatus('stopped', 'Status: Connection failed - Check backend server');
                
                // Show helpful error message
                if (error.message.includes('ECONNREFUSED') || error.message.includes('Failed to fetch')) {
                    addLog('error', 'Backend server is not running or not accessible', 'frontend');
                    addLog('info', 'Make sure backend is running on port 5000', 'frontend');
                    addLog('info', `Try: npm start in backend folder`, 'frontend');
                } else if (error.message.includes('timeout')) {
                    addLog('error', 'Connection timeout - backend may be slow to respond', 'frontend');
                }
            });
            
            socket.on('reconnect', (attemptNumber) => {
                addLog('success', `Reconnected after ${attemptNumber} attempts`, 'frontend');
            });
            
            socket.on('reconnect_attempt', (attemptNumber) => {
                addLog('info', `Reconnection attempt ${attemptNumber}...`, 'frontend');
            });
            
            socket.on('reconnect_failed', () => {
                addLog('error', 'Failed to reconnect after all attempts', 'frontend');
            });
            
            // Listen for AI question generation - Backend emits 'follow_up_suggestion', not 'ai_question_generated'
            socket.on('follow_up_suggestion', (data) => {
                addLog('success', `Question received: ${data.question?.substring(0, 50)}...`, 'backend');
                if (data.question && data.question.trim().length > 10) {
                    generatedQuestions.push({
                        question: data.question,
                        model: data.model || 'rule-based', // Backend doesn't send model, use default
                        responseTime: data.responseTime || 0, // Backend doesn't send responseTime
                        timestamp: new Date().toLocaleTimeString()
                    });
                    displayQuestions();
                    document.getElementById('questionCount').textContent = generatedQuestions.length;
                }
            });
            
            // Listen for question generation errors
            socket.on('question_generation_error', (data) => {
                addLog('error', `Question generation error: ${data.error}`, 'backend');
            });
            
            // Listen for backend logs (if backend emits them)
            socket.on('backend_log', (data) => {
                addLog(data.type || 'info', data.message || JSON.stringify(data), 'backend');
            });
            
            // Listen for transcript validation logs
            socket.on('transcript_validation', (data) => {
                if (data.valid) {
                    addLog('success', `Valid transcript: ${data.transcript?.substring(0, 30)}...`, 'backend');
                } else {
                    addLog('warning', `Invalid transcript rejected: ${data.reason}`, 'backend');
                }
            });
        }
        
        // Initialize Web Speech API
        function initSpeechRecognition() {
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                addLog('error', 'Speech recognition not supported', 'frontend');
                alert('Speech recognition not supported in this browser. Please use Chrome or Edge.');
                return false;
            }
            
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'en-US'; // Fixed: Single language
            
            recognition.onstart = () => {
                addLog('success', 'Speech recognition started', 'frontend');
                isListening = true;
                updateStatus('listening', 'Status: Listening... Speak now!');
                document.getElementById('startBtn').disabled = true;
                document.getElementById('stopBtn').disabled = false;
            };
            
            recognition.onresult = (event) => {
                let interimTranscript = '';
                let finalTranscript = '';
                
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const transcript = event.results[i][0].transcript;
                    const confidence = event.results[i][0].confidence || 0;
                    
                    if (event.results[i].isFinal) {
                        finalTranscript += transcript + ' ';
                        addLog('info', `Final transcript: ${transcript.trim()} (confidence: ${(confidence * 100).toFixed(0)}%)`, 'frontend');
                    } else {
                        interimTranscript += transcript;
                    }
                }
                
                if (finalTranscript) {
                    const trimmedFinal = finalTranscript.trim();
                    fullTranscript += trimmedFinal + ' ';
                    
                    // Send to backend via Socket.IO (like FreeTranscription.js)
                    if (socket && socket.connected && trimmedFinal.length > 0) {
                        // Client-side validation
                        if (isValidTranscript(trimmedFinal, 0.3)) {
                            socket.emit('transcript_update', {
                                meetingId: meetingId,
                                participantId: participantId,
                                participantName: participantName,
                                transcript: trimmedFinal,
                                timestamp: Date.now(),
                                language: 'en-US',
                                confidence: 0.8 // Default confidence
                            });
                            addLog('info', `Sent transcript to backend: ${trimmedFinal.substring(0, 30)}...`, 'frontend');
                        } else {
                            addLog('warning', `Invalid transcript filtered: ${trimmedFinal.substring(0, 30)}...`, 'frontend');
                        }
                    }
                    
                    updateTranscript();
                }
                
                // Show interim results
                if (interimTranscript) {
                    document.getElementById('transcriptDiv').textContent = fullTranscript + interimTranscript;
                }
            };
            
            recognition.onerror = (event) => {
                addLog('error', `Speech recognition error: ${event.error}`, 'frontend');
                if (event.error === 'no-speech') {
                    return; // Ignore no-speech errors
                }
                updateStatus('stopped', `Error: ${event.error}`);
                stopListening();
            };
            
            recognition.onend = () => {
                addLog('info', 'Speech recognition ended', 'frontend');
                if (isListening) {
                    // Restart if still listening
                    try {
                        recognition.start();
                    } catch (e) {
                        addLog('warning', `Recognition restart failed: ${e.message}`, 'frontend');
                    }
                }
            };
            
            return true;
        }
        
        // Client-side transcript validation (same as FreeTranscription.js)
        function isValidTranscript(transcript, confidence) {
            if (!transcript || typeof transcript !== 'string') {
                return false;
            }
            
            const trimmed = transcript.trim();
            
            // Reject empty or very short transcripts
            if (trimmed.length < 3) {
                return false;
            }
            
            // Reject low confidence transcripts
            if (confidence !== undefined && confidence < 0.3) {
                return false;
            }
            
            // Reject common filler words and noise
            const fillerWords = ['um', 'uh', 'ah', 'er', 'hmm', 'mm', 'mhm'];
            const lowerText = trimmed.toLowerCase();
            
            if (fillerWords.includes(lowerText)) {
                return false;
            }
            
            // Reject if it's just punctuation or special characters
            if (/^[^\w\s]+$/.test(trimmed)) {
                return false;
            }
            
            // Reject if it's mostly numbers or special characters
            const wordCount = trimmed.split(/\s+/).filter(w => w.length > 0).length;
            if (wordCount === 0) {
                return false;
            }
            
            return true;
        }
        
        function startListening() {
            if (!recognition) {
                if (!initSpeechRecognition()) {
                    return;
                }
            }
            
            if (!socket || !socket.connected) {
                addLog('error', 'Socket not connected. Reconnecting...', 'frontend');
                initSocket();
                setTimeout(() => {
                    if (socket && socket.connected) {
                        startListening();
                    }
                }, 1000);
                return;
            }
            
            try {
                recognition.start();
            } catch (e) {
                addLog('error', `Error starting recognition: ${e.message}`, 'frontend');
                updateStatus('stopped', 'Error: Could not start recognition');
            }
        }
        
        function stopListening() {
            isListening = false;
            if (recognition) {
                recognition.stop();
            }
            updateStatus('stopped', 'Status: Stopped');
            document.getElementById('startBtn').disabled = false;
            document.getElementById('stopBtn').disabled = true;
            
            // Enable generate buttons if transcript exists
            if (fullTranscript.trim().length > 0) {
                document.getElementById('generateQuestionsBtn').disabled = false;
                document.getElementById('generateNotesBtn').disabled = false;
            }
        }
        
        function clearAll() {
            fullTranscript = '';
            generatedQuestions = [];
            logs = [];
            updateTranscript();
            updateLogsDisplay();
            document.getElementById('questionsBox').style.display = 'none';
            document.getElementById('notesBox').style.display = 'none';
            document.getElementById('generateQuestionsBtn').disabled = true;
            document.getElementById('generateNotesBtn').disabled = true;
            document.getElementById('questionCount').textContent = '0';
            addLog('info', 'Cleared all data', 'frontend');
        }
        
        function updateTranscript() {
            document.getElementById('transcriptDiv').textContent = fullTranscript || 'Your speech will appear here...';
            updateStats();
        }
        
        function updateStats() {
            const text = fullTranscript.trim();
            const words = text.split(/\s+/).filter(w => w.length > 0);
            const sentences = text.split(/[.!?]+/).filter(s => s.trim().length > 0);
            
            document.getElementById('wordCount').textContent = words.length;
            document.getElementById('sentenceCount').textContent = sentences.length;
            document.getElementById('charCount').textContent = text.length;
        }
        
        function updateStatus(type, message) {
            const statusDiv = document.getElementById('statusDiv');
            statusDiv.className = `status ${type}`;
            statusDiv.textContent = message;
        }
        
        // Trigger question generation manually - starts automatic question generation timer
        function triggerQuestionGeneration() {
            if (!socket || !socket.connected) {
                addLog('error', 'Socket not connected', 'frontend');
                alert('Not connected to backend. Please wait for connection.');
                return;
            }
            
            if (fullTranscript.trim().length < 100) {
                addLog('warning', 'Transcript too short (need at least 100 characters)', 'frontend');
                alert('Please speak more! Need at least 100 characters for question generation.');
                return;
            }
            
            addLog('info', 'Starting question generation timer...', 'frontend');
            
            // FIX: Use 'start_question_generation' instead of 'generate_question'
            // This starts the question generation timer that checks every 60 seconds
            socket.emit('start_question_generation', {
                meetingId: meetingId
            });
            
            addLog('info', 'Question generation started - questions will appear automatically every 60 seconds', 'frontend');
        }
        
        function displayQuestions() {
            const questionsContent = document.getElementById('questionsContent');
            const questionsBox = document.getElementById('questionsBox');
            
            if (generatedQuestions.length === 0) {
                questionsContent.innerHTML = '<p>No questions generated yet. Keep speaking and questions will appear automatically!</p>';
                questionsBox.style.display = 'block';
                return;
            }
            
            let html = '';
            generatedQuestions.slice().reverse().forEach((q, index) => {
                html += `
                    <div class="question-item">
                        <strong>Question ${generatedQuestions.length - index} (${q.model}):</strong>
                        <div>${q.question}</div>
                        <small style="color: #6c757d;">Generated at ${q.timestamp} | Response time: ${q.responseTime}ms</small>
                    </div>
                `;
            });
            
            questionsContent.innerHTML = html;
            questionsBox.style.display = 'block';
        }
        
        async function generateNotes() {
            if (!fullTranscript.trim()) {
                alert('Please speak something first!');
                return;
            }
            
            const notesBox = document.getElementById('notesBox');
            const notesContent = document.getElementById('notesContent');
            const generateBtn = document.getElementById('generateNotesBtn');
            
            generateBtn.disabled = true;
            notesBox.style.display = 'block';
            notesContent.innerHTML = '<div class="loading">🔄 Generating notes from your speech... Please wait...</div>';
            addLog('info', 'Generating meeting notes...', 'frontend');
            
            try {
                const backendUrl = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
                    ? 'http://localhost:5000'
                    : `http://${window.location.hostname}:5000`;
                
                // FIX: Backend expects 'transcript' (single string), not 'transcripts' (array)
                addLog('info', `Sending transcript to backend (length: ${fullTranscript.trim().length} chars)`, 'frontend');
                
                const response = await fetch(`${backendUrl}/api/ai/test-speech-to-notes`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        transcript: fullTranscript.trim(), // Single string - this is what backend expects
                        participantName: participantName
                    })
                });
                
                if (!response.ok) {
                    const errorText = await response.text();
                    addLog('error', `Backend error response: ${errorText}`, 'frontend');
                    throw new Error(`HTTP error! status: ${response.status}, message: ${errorText}`);
                }
                
                const data = await response.json();
                addLog('success', `Notes generated successfully (model: ${data.model})`, 'backend');
                
                if (data.success && data.notes) {
                    displayNotes(data.notes, data.model, data.responseTime);
                } else {
                    throw new Error(data.error || 'Failed to generate notes');
                }
            } catch (error) {
                addLog('error', `Notes generation failed: ${error.message}`, 'frontend');
                notesContent.innerHTML = `
                    <div class="error">
                        <strong>❌ Error:</strong> ${error.message}
                        <br><br>
                        <small>Make sure backend server is running and GEMINI_API_KEY is set.</small>
                    </div>
                `;
            } finally {
                generateBtn.disabled = false;
            }
        }
        
        function displayNotes(notes, model, responseTime) {
            const notesContent = document.getElementById('notesContent');
            
            let html = `
                <div class="model-info">
                    <strong>Model:</strong> ${model} | 
                    <strong>Response Time:</strong> ${responseTime}ms
                </div>
            `;
            
            if (notes.summary) {
                html += `
                    <div class="notes-section">
                        <h4>📄 Summary</h4>
                        <p>${notes.summary}</p>
                    </div>
                `;
            }
            
            if (notes.importantPoints && notes.importantPoints.length > 0) {
                html += `
                    <div class="notes-section">
                        <h4>🔑 Important Points</h4>
                        <ul>
                            ${notes.importantPoints.map(point => `<li>${point}</li>`).join('')}
                        </ul>
                    </div>
                `;
            }
            
            notesContent.innerHTML = html;
        }
        
        // Initialize on page load
        window.onload = () => {
            addLog('info', 'Page loaded, initializing...', 'frontend');
            initSocket();
            initSpeechRecognition();
            addLog('info', 'Initialization complete', 'frontend');
        };
    </script>
</body>
</html>
