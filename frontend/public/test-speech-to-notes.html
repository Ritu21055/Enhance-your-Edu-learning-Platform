<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speech → Questions → Notes Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
        }
        
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        button {
            padding: 12px 24px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }
        
        .btn-start {
            background: #28a745;
            color: white;
        }
        
        .btn-start:hover {
            background: #218838;
        }
        
        .btn-stop {
            background: #dc3545;
            color: white;
        }
        
        .btn-stop:hover {
            background: #c82333;
        }
        
        .btn-generate-questions {
            background: #ffc107;
            color: #212529;
        }
        
        .btn-generate-questions:hover {
            background: #e0a800;
        }
        
        .btn-generate-notes {
            background: #007bff;
            color: white;
        }
        
        .btn-generate-notes:hover {
            background: #0056b3;
        }
        
        .btn-clear {
            background: #6c757d;
            color: white;
        }
        
        .btn-clear:hover {
            background: #5a6268;
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .status {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: bold;
        }
        
        .status.listening {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .status.stopped {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .transcript-box, .questions-box, .notes-box {
            background: #f8f9fa;
            border: 2px solid #dee2e6;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            min-height: 200px;
            max-height: 400px;
            overflow-y: auto;
        }
        
        .questions-box {
            background: #fff3cd;
            border-color: #ffc107;
        }
        
        .notes-box {
            background: #d1ecf1;
            border-color: #17a2b8;
        }
        
        .transcript-box h3, .questions-box h3, .notes-box h3 {
            margin-bottom: 10px;
            color: #495057;
        }
        
        .question-item {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 4px solid #ffc107;
        }
        
        .question-item strong {
            color: #856404;
            display: block;
            margin-bottom: 5px;
        }
        
        .transcript-text {
            font-size: 16px;
            line-height: 1.6;
            color: #212529;
            white-space: pre-wrap;
        }
        
        .notes-content {
            background: white;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #17a2b8;
        }
        
        .notes-section {
            margin-bottom: 20px;
        }
        
        .notes-section h4 {
            color: #0c5460;
            margin-bottom: 10px;
            border-bottom: 2px solid #17a2b8;
            padding-bottom: 5px;
        }
        
        .model-info {
            margin-bottom: 15px;
            padding: 10px;
            background: #e9ecef;
            border-radius: 5px;
            font-size: 14px;
        }
        
        .notes-section ul {
            margin-left: 20px;
        }
        
        .notes-section li {
            margin-bottom: 8px;
            line-height: 1.6;
        }
        
        .loading {
            text-align: center;
            padding: 20px;
            color: #007bff;
            font-weight: bold;
        }
        
        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
        }
        
        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .stat-card {
            background: #e9ecef;
            padding: 15px;
            border-radius: 8px;
            flex: 1;
            min-width: 150px;
        }
        
        .stat-card strong {
            display: block;
            color: #495057;
            margin-bottom: 5px;
        }
        
        .stat-card span {
            font-size: 24px;
            color: #007bff;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎤 Speech → Questions → Notes Test</h1>
        
        <div class="controls">
            <button class="btn-start" onclick="startListening()" id="startBtn">🎤 Start Listening</button>
            <button class="btn-stop" onclick="stopListening()" disabled id="stopBtn">⏹️ Stop Listening</button>
            <button class="btn-generate-questions" onclick="generateQuestions()" disabled id="generateQuestionsBtn">❓ Generate Questions</button>
            <button class="btn-generate-notes" onclick="generateNotes()" disabled id="generateNotesBtn">📝 Generate Notes</button>
            <button class="btn-clear" onclick="clearAll()">🗑️ Clear All</button>
        </div>
        
        <div class="status stopped" id="statusDiv">
            Status: Stopped - Click "Start Listening" to begin
        </div>
        
        <div class="stats">
            <div class="stat-card">
                <strong>Words</strong>
                <span id="wordCount">0</span>
            </div>
            <div class="stat-card">
                <strong>Sentences</strong>
                <span id="sentenceCount">0</span>
            </div>
            <div class="stat-card">
                <strong>Characters</strong>
                <span id="charCount">0</span>
            </div>
        </div>
        
        <div class="transcript-box">
            <h3>📝 Your Speech Transcript:</h3>
            <div class="transcript-text" id="transcriptDiv">
                Your speech will appear here...
            </div>
        </div>
        
        <div class="questions-box" id="questionsBox" style="display: none;">
            <h3>❓ Generated Questions:</h3>
            <div id="questionsContent"></div>
        </div>
        
        <div class="notes-box" id="notesBox" style="display: none;">
            <h3>📋 Generated Notes:</h3>
            <div class="notes-content" id="notesContent"></div>
        </div>
    </div>
    
    <script>
        let recognition = null;
        let fullTranscript = '';
        let isListening = false;
        let generatedQuestions = [];
        
        // Initialize Web Speech API
        function initSpeechRecognition() {
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                alert('Speech recognition not supported in this browser. Please use Chrome or Edge.');
                return false;
            }
            
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'en-US,hi-IN'; // Prioritize English, fallback to Hindi
            
            recognition.onstart = () => {
                console.log('🎤 Speech recognition started');
                isListening = true;
                updateStatus('listening', 'Status: Listening... Speak now!');
                document.getElementById('startBtn').disabled = true;
                document.getElementById('stopBtn').disabled = false;
            };
            
            recognition.onresult = (event) => {
                let interimTranscript = '';
                let finalTranscript = '';
                
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const transcript = event.results[i][0].transcript;
                    if (event.results[i].isFinal) {
                        finalTranscript += transcript + ' ';
                    } else {
                        interimTranscript += transcript;
                    }
                }
                
                if (finalTranscript) {
                    fullTranscript += finalTranscript;
                    updateTranscript();
                }
                
                // Show interim results
                if (interimTranscript) {
                    document.getElementById('transcriptDiv').textContent = fullTranscript + interimTranscript;
                }
            };
            
            recognition.onerror = (event) => {
                console.error('Speech recognition error:', event.error);
                if (event.error === 'no-speech') {
                    // Ignore no-speech errors
                    return;
                }
                updateStatus('stopped', `Error: ${event.error}`);
                stopListening();
            };
            
            recognition.onend = () => {
                console.log('🎤 Speech recognition ended');
                if (isListening) {
                    // Restart if still listening
                    try {
                        recognition.start();
                    } catch (e) {
                        console.log('Recognition already started or error:', e);
                    }
                }
            };
            
            return true;
        }
        
        function startListening() {
            if (!recognition) {
                if (!initSpeechRecognition()) {
                    return;
                }
            }
            
            try {
                recognition.start();
            } catch (e) {
                console.error('Error starting recognition:', e);
                updateStatus('stopped', 'Error: Could not start recognition');
            }
        }
        
        function stopListening() {
            isListening = false;
            if (recognition) {
                recognition.stop();
            }
            updateStatus('stopped', 'Status: Stopped');
            document.getElementById('startBtn').disabled = false;
            document.getElementById('stopBtn').disabled = true;
            
            // Enable generate buttons if transcript exists
            if (fullTranscript.trim().length > 0) {
                document.getElementById('generateQuestionsBtn').disabled = false;
                document.getElementById('generateNotesBtn').disabled = false;
            }
        }
        
        function clearAll() {
            fullTranscript = '';
            generatedQuestions = [];
            updateTranscript();
            document.getElementById('questionsBox').style.display = 'none';
            document.getElementById('notesBox').style.display = 'none';
            document.getElementById('generateQuestionsBtn').disabled = true;
            document.getElementById('generateNotesBtn').disabled = true;
        }
        
        function updateTranscript() {
            document.getElementById('transcriptDiv').textContent = fullTranscript || 'Your speech will appear here...';
            updateStats();
        }
        
        function updateStats() {
            const text = fullTranscript.trim();
            const words = text.split(/\s+/).filter(w => w.length > 0);
            const sentences = text.split(/[.!?]+/).filter(s => s.trim().length > 0);
            
            document.getElementById('wordCount').textContent = words.length;
            document.getElementById('sentenceCount').textContent = sentences.length;
            document.getElementById('charCount').textContent = text.length;
        }
        
        function updateStatus(type, message) {
            const statusDiv = document.getElementById('statusDiv');
            statusDiv.className = `status ${type}`;
            statusDiv.textContent = message;
        }
        
        async function generateQuestions() {
            if (!fullTranscript.trim()) {
                alert('Please speak something first!');
                return;
            }
            
            const questionsBox = document.getElementById('questionsBox');
            const questionsContent = document.getElementById('questionsContent');
            const generateBtn = document.getElementById('generateQuestionsBtn');
            
            generateBtn.disabled = true;
            questionsBox.style.display = 'block';
            questionsContent.innerHTML = '<div class="loading">🔄 Generating questions from your speech... Please wait...</div>';
            
            try {
                const backendUrl = window.location.origin.includes('localhost') 
                    ? 'http://localhost:5000' 
                    : window.location.origin.replace(':3000', ':5000');
                
                // Extract topics from transcript
                const words = fullTranscript.toLowerCase().split(/\s+/);
                const topics = [...new Set(words.filter(w => w.length > 4))].slice(0, 5);
                
                const response = await fetch(`${backendUrl}/api/ai/test-gemini-emotions`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        transcriptContext: fullTranscript.trim(),
                        topics: topics,
                        sentiment: 'neutral',
                        allParticipantsWithEmotions: [],
                        participantEmotions: {},
                        participantNames: {},
                        emotionCategories: {},
                        currentEmotion: undefined,
                        forceOllama: false
                    })
                });
                
                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`HTTP error! status: ${response.status}, message: ${errorText}`);
                }
                
                const data = await response.json();
                
                if (data.success && data.question) {
                    generatedQuestions.push({
                        question: data.question,
                        model: data.model,
                        responseTime: data.responseTime,
                        timestamp: new Date().toLocaleTimeString()
                    });
                    displayQuestions();
                } else {
                    throw new Error(data.error || 'Failed to generate question');
                }
            } catch (error) {
                console.error('Error generating questions:', error);
                questionsContent.innerHTML = `
                    <div class="error">
                        <strong>❌ Error:</strong> ${error.message}
                        <br><br>
                        <small>Make sure backend server is running and LLM is configured.</small>
                    </div>
                `;
            } finally {
                generateBtn.disabled = false;
            }
        }
        
        function displayQuestions() {
            const questionsContent = document.getElementById('questionsContent');
            
            if (generatedQuestions.length === 0) {
                questionsContent.innerHTML = '<p>No questions generated yet.</p>';
                return;
            }
            
            let html = '';
            generatedQuestions.forEach((q, index) => {
                html += `
                    <div class="question-item">
                        <strong>Question ${index + 1} (${q.model}):</strong>
                        <div>${q.question}</div>
                        <small style="color: #6c757d;">Generated at ${q.timestamp} | Response time: ${q.responseTime}ms</small>
                    </div>
                `;
            });
            
            questionsContent.innerHTML = html;
        }
        
        async function generateNotes() {
            if (!fullTranscript.trim()) {
                alert('Please speak something first!');
                return;
            }
            
            const notesBox = document.getElementById('notesBox');
            const notesContent = document.getElementById('notesContent');
            const generateBtn = document.getElementById('generateNotesBtn');
            
            generateBtn.disabled = true;
            notesBox.style.display = 'block';
            notesContent.innerHTML = '<div class="loading">🔄 Generating notes from your speech... Please wait...</div>';
            
            try {
                const backendUrl = window.location.origin.includes('localhost') 
                    ? 'http://localhost:5000' 
                    : window.location.origin.replace(':3000', ':5000');
                
                const response = await fetch(`${backendUrl}/api/ai/test-speech-to-notes`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        transcript: fullTranscript.trim(),
                        participantName: 'You'
                    })
                });
                
                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`HTTP error! status: ${response.status}, message: ${errorText}`);
                }
                
                const data = await response.json();
                
                if (data.success && data.notes) {
                    displayNotes(data.notes, data.model, data.responseTime);
                } else {
                    throw new Error(data.error || 'Failed to generate notes');
                }
            } catch (error) {
                console.error('Error generating notes:', error);
                notesContent.innerHTML = `
                    <div class="error">
                        <strong>❌ Error:</strong> ${error.message}
                        <br><br>
                        <small>Make sure backend server is running and GEMINI_API_KEY is set.</small>
                    </div>
                `;
            } finally {
                generateBtn.disabled = false;
            }
        }
        
        function displayNotes(notes, model, responseTime) {
            const notesContent = document.getElementById('notesContent');
            
            let html = `
                <div class="model-info">
                    <strong>Model:</strong> ${model} | 
                    <strong>Response Time:</strong> ${responseTime}ms
                </div>
            `;
            
            if (notes.summary) {
                html += `
                    <div class="notes-section">
                        <h4>📄 Summary</h4>
                        <p>${notes.summary}</p>
                    </div>
                `;
            }
            
            if (notes.keyPoints && notes.keyPoints.length > 0) {
                html += `
                    <div class="notes-section">
                        <h4>🔑 Key Points</h4>
                        <ul>
                            ${notes.keyPoints.map(point => `<li>${point}</li>`).join('')}
                        </ul>
                    </div>
                `;
            }
            
            if (notes.actionItems && notes.actionItems.length > 0) {
                html += `
                    <div class="notes-section">
                        <h4>✅ Action Items</h4>
                        <ul>
                            ${notes.actionItems.map(item => {
                                if (typeof item === 'object' && item.task) {
                                    return `<li><strong>${item.task}</strong>${item.assignedTo ? ` (Assigned to: ${item.assignedTo})` : ''}${item.deadline ? ` - Deadline: ${item.deadline}` : ''}</li>`;
                                }
                                return `<li>${item}</li>`;
                            }).join('')}
                        </ul>
                    </div>
                `;
            }
            
            if (notes.decisions && notes.decisions.length > 0) {
                html += `
                    <div class="notes-section">
                        <h4>🎯 Decisions</h4>
                        <ul>
                            ${notes.decisions.map(decision => `<li>${decision}</li>`).join('')}
                        </ul>
                    </div>
                `;
            }
            
            if (notes.studyGuide) {
                const studyGuide = notes.studyGuide;
                if (studyGuide.definitions && studyGuide.definitions.length > 0) {
                    html += `
                        <div class="notes-section">
                            <h4>📚 Definitions</h4>
                            <ul>
                                ${studyGuide.definitions.map(def => `<li>${def}</li>`).join('')}
                            </ul>
                        </div>
                    `;
                }
                if (studyGuide.examples && studyGuide.examples.length > 0) {
                    html += `
                        <div class="notes-section">
                            <h4>💡 Examples</h4>
                            <ul>
                                ${studyGuide.examples.map(ex => `<li>${ex}</li>`).join('')}
                            </ul>
                        </div>
                    `;
                }
                if (studyGuide.formulas && studyGuide.formulas.length > 0) {
                    html += `
                        <div class="notes-section">
                            <h4>🔢 Formulas</h4>
                            <ul>
                                ${studyGuide.formulas.map(formula => `<li>${formula}</li>`).join('')}
                            </ul>
                        </div>
                    `;
                }
            }
            
            if (notes.participantContributions) {
                const contributions = typeof notes.participantContributions === 'object' 
                    ? Object.entries(notes.participantContributions)
                    : [];
                if (contributions.length > 0) {
                    html += `
                        <div class="notes-section">
                            <h4>👥 Participant Contributions</h4>
                            <ul>
                                ${contributions.map(([name, contribs]) => {
                                    const contribList = Array.isArray(contribs) ? contribs : [contribs];
                                    return contribList.map(contrib => `<li><strong>${name}:</strong> ${contrib}</li>`).join('');
                                }).join('')}
                            </ul>
                        </div>
                    `;
                }
            }
            
            if (notes.conversationTranscript) {
                html += `
                    <div class="notes-section">
                        <h4>💬 Conversation Transcript</h4>
                        <pre style="background: #f8f9fa; padding: 15px; border-radius: 5px; overflow-x: auto; white-space: pre-wrap;">${notes.conversationTranscript}</pre>
                    </div>
                `;
            }
            
            notesContent.innerHTML = html;
        }
        
        // Initialize on page load
        window.onload = () => {
            console.log('🚀 Speech-to-Questions-to-Notes test page loaded');
            initSpeechRecognition();
        };
    </script>
</body>
</html>
